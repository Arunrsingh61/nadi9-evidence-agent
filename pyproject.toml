[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nadi9-evidence-agent"
version = "1.0.0"
description = "Offline evidence-grounded subtitle decision and correction pipeline"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
nadi9 = "nadi9.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
